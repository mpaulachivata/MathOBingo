        .replace(/\s+/g, " ")
        .trim()
        .toLowerCase();
      const bingoModeMeta = {
        x: { label: "Diagonales X", total: 2 },
        square: { label: "Cuadro 3x3", total: 9 },
        row: { label: "Una fila", total: 5 },
        full: { label: "Cartón completo", total: 1 }
      };
      function getModeNoProgressText(mode) {
        const texts = {
          x: "Aún no hay diagonales X completas",
          square: "Aún no hay un cuadro 3x3 completo",
          row: "Aún no hay una fila completa",
          full: "Aún no hay un cartón completo"
        };
        return texts[mode] || "Aún no hay un ganador";
      }
      function getMarkedCount(card, drawn) {
        return card.values.reduce((count, value, index) => {
          if (index === 12) return count;
          return count + (drawn.has(normalizeBingo(value)) ? 1 : 0);
        }, 0);
      }
      function getModeProgress(card, drawn) {
        const marked = getMarkedCount(card, drawn);
        let patterns;
        if (selectedMode === "x") {
          patterns = [
            { id: "d1", cells: [0, 6, 12, 18, 24] },
            { id: "d2", cells: [4, 8, 12, 16, 20] }
          ];
        } else if (selectedMode === "square") {
          patterns = [];
          for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
              const cells = [];
              for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 3; c++) {
                  cells.push((row + r) * 5 + (col + c));
                }
              }
              patterns.push({ id: `s${row}${col}`, cells });
            }
          }
        } else if (selectedMode === "row") {
          patterns = Array.from({ length: 5 }, (_, row) => ({
            id: `r${row}`,
            cells: Array.from({ length: 5 }, (_, col) => row * 5 + col)
          }));
        } else {
          patterns = [{
            id: "full",
            cells: Array.from({ length: 25 }, (_, index) => index)
          }];
        }
        const isMarked = index => index === 12 || drawn.has(normalizeBingo(card.values[index]));
        const matches = patterns.filter(pattern => pattern.cells.every(isMarked));
        const isNear = matches.length === 0 && patterns.some(pattern =>
          pattern.cells.filter(index => !isMarked(index)).length === 1
        );
        return {
          marked,
          score: matches.length,
          total: bingoModeMeta[selectedMode].total,
          matches: matches.map(pattern => pattern.id),
          isNear
        };
      }
      function updateBingoNotice(winners, nearWinners) {
        const parts = [];
        if (winners.length) {
          const numbers = winners.map(card => card.number).join(", ");
          parts.push(winners.length === 1
            ? `Ya hay un ganador ¡revisa tu cartón! en ${bingoModeMeta[selectedMode].label}.`
            : `Ya hay más de un ganador ¡revisa tu cartón! en ${bingoModeMeta[selectedMode].label}.`);
        }
        if (nearWinners.length) {
          const numbers = nearWinners.map(card => card.number).join(", ");
          parts.push(`${nearWinners.length === 1 ? "Hay un cartón" : "Hay cartones"} ${nearWinners.length === 1 ? "que está" : "que están"} a un número de ganar en ${bingoModeMeta[selectedMode].label}.`);
        }
        if (parts.length) showBingoNotice(parts.join(" "));
      }
      function showBingoNotice(message) {
        const notice = $("bingo-notice");
        notice.textContent = message;
        notice.hidden = false;
        clearTimeout(bingoNoticeTimer);
        bingoNoticeTimer = setTimeout(() => {
          notice.hidden = true;
          notice.textContent = "";
        }, 5200);
      }
      function getPlayerCount() {
        const input = $("bingo-player-count");
        const parsed = Number.parseInt(input.value, 10);
        return Number.isFinite(parsed) ? Math.max(1, Math.min(bingoCards.length, parsed)) : bingoCards.length;
      }
      function renderBingo({ announce = false } = {}) {
        const playerCount = getPlayerCount();
        const activeCards = bingoCards.slice(0, playerCount);
        const drawn = new Set([...visited].map(index => normalizeBingo(raw[index][1])));
        const results = activeCards.map(card => {
          const progress = getModeProgress(card, drawn);
          return {
            ...card,
            marked: progress.marked,
            score: progress.score,
            matches: progress.matches,
            total: progress.total,
            isNear: progress.isNear
          };
        }).sort((a, b) => b.score - a.score || b.marked - a.marked || a.number - b.number);

        const currentWinners = results.filter(card => card.score > 0);
        const currentNearWinners = results.filter(card => card.isNear && card.score === 0);
        const snapshot = modeSnapshots.get(selectedMode) || { winners: new Set(), near: new Set() };
        if (announce) {
          const newWinners = currentWinners.filter(card => !snapshot.winners.has(card.number));
          const newNearWinners = currentNearWinners.filter(card => !snapshot.near.has(card.number));
          updateBingoNotice(newWinners, newNearWinners);
        }
        currentWinners.forEach(card => snapshot.winners.add(card.number));
        currentNearWinners.forEach(card => snapshot.near.add(card.number));
        modeSnapshots.set(selectedMode, snapshot);

        const maxScore = results.length ? Math.max(...results.map(card => card.score)) : 0;
        const leaders = maxScore > 0 ? results.filter(card => card.score === maxScore) : [];

        $("bingo-player-count").max = String(bingoCards.length);
        $("bingo-player-help").textContent = `Se cuentan los cartones del 1 al ${playerCount}, en orden.`;
        $("bingo-summary").textContent = results.length
          ? (leaders.length
              ? `${leaders.length === 1 ? "Cartón" : "Cartones"} ${leaders.map(card => card.number).join(", ")} va${leaders.length === 1 ? "" : "n"} ganando en ${bingoModeMeta[selectedMode].label.toLowerCase()}`
              : getModeNoProgressText(selectedMode))
          : "Aún no hay extracciones";
        $("bingo-panel").hidden = !showAllBingo;
        $("bingo-summary").hidden = !showAllBingo;
        $("bingo-grid").hidden = !showAllBingo;

        const table = document.createElement("table");
        const thead = document.createElement("thead");
        thead.innerHTML = `
          <tr>
            <th scope="col">Cartón</th>
            <th scope="col">Marcadas</th>
            <th scope="col">Objetivo</th>
            <th scope="col">Estado</th>
          </tr>
        `;
        const tbody = document.createElement("tbody");
        for (const card of results) {
          const row = document.createElement("tr");
          if (leaders.includes(card)) row.classList.add("leader");
          const status = card.score === 0
            ? card.isNear ? "A un número" : "En progreso"
            : (selectedMode === "full" ? "Completado" : `Completado (${card.score})`);
          const label = selectedMode === "x" ? "Diagonales" : selectedMode === "square" ? "Cuadros" : selectedMode === "row" ? "Filas" : "Cartón";
          row.innerHTML = `
            <td><strong>Cartón ${card.number}</strong>${leaders.includes(card) ? " <span class=\"bingo-status-pill is-leader\">Líder</span>" : ""}</td>
            <td>${card.marked} / 24</td>
            <td>${label}: ${card.matches.length || 0}</td>
            <td><span class="bingo-status-pill ${card.score > 0 || leaders.includes(card) ? "is-leader" : ""}">${status}</span></td>
          `;
          tbody.appendChild(row);
        }
        table.append(thead, tbody);
        $("bingo-grid").replaceChildren(table);
      }

      function shuffle() {
        deck = raw.map((_, i) => i);
        for (let i = deck.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [deck[i], deck[j]] = [deck[j], deck[i]];
        }
      }
      function math(element, text) {
        element.textContent = text.replace(/\$\$([\s\S]*?)\$\$/g, "$$$1$$");
        if (typeof renderMathInElement === "function") {
          renderMathInElement(element, {
            delimiters: [{left:"$",right:"$",display:false}],
            throwOnError:false,
            strict:"ignore"
          });
        }
      }
      function updateTimer() {
        $("timer-display").textContent = `${String(Math.floor(remaining / 60)).padStart(2,"0")}:${String(remaining % 60).padStart(2,"0")}`;
        $("timer-ring").style.setProperty("--progress", `${remaining * 4}deg`);
        $("timer-state").textContent = remaining === 0 ? "¡Tiempo agotado!" : (remaining === 90 && timer === null ? "Listo para iniciar" : "");
      }
      function updateStartButton() {
        $("start-label").hidden = timer !== null;
        $("pause-label").hidden = timer === null;
      }
      function pause() {
        if (timer !== null) clearInterval(timer);
        timer = null;
        updateStartButton();
      }
      function start() {
        if (timer !== null || remaining === 0) return;
        timer = setInterval(() => {
          remaining = Math.max(0, remaining - 1);
          updateTimer();
          if (remaining === 0) pause();
        }, 1000);
        updateStartButton();
      }
      function resetTimer() {
        pause();
        remaining = 90;
        updateTimer();
      }
      function renderQuestion() {
        $("question-progress").textContent = `Pregunta ${current + 1} de ${raw.length}`;
        math($("current-question"), raw[deck[current]][0]);
        math($("previous-text"), current ? raw[deck[current - 1]][0] : "Todavía no hay una pregunta anterior.");
        $("previous-question").disabled = current === 0;
        $("next-question").disabled = gameFinished && current === deck.length - 1;
        $("next-label").textContent = current === deck.length - 1
          ? gameFinished ? "Partida finalizada" : "Finalizar partida →"
          : "Siguiente →";
        resetTimer();
        const newDraw = !visited.has(deck[current]);
        visited.add(deck[current]);
        return newDraw;
      }
      function renderHistory({ announce = false } = {}) {
        const entries = [...visited].filter(index => index !== deck[current]);
        const body = $("history-body");
        body.replaceChildren();
        for (const index of entries) {
          const row = document.createElement("tr");
          for (const value of raw[index]) {
            const cell = document.createElement("td");
            math(cell, value);
            row.append(cell);
          }
          body.append(row);
        }
        $("history-empty").hidden = entries.length > 0;
        $("history-table-wrap").hidden = entries.length === 0;
        renderBingo({ announce });
      }
      function cancelRestart() {
        confirmingRestart = false;
        $("restart-game").classList.remove("is-confirming");
        $("restart-label").hidden = false;
        $("confirm-restart-label").hidden = true;
      }
      function moveTo(index) {
        cancelRestart();
        if (index < 0 || index > deck.length || (gameFinished && index === deck.length)) return;
        if (index === deck.length) {
          gameFinished = true;
          $("next-question").disabled = true;
          $("next-label").textContent = "Partida finalizada";
          if (!$("history-panel").hidden) renderHistory();
          else renderBingo();
          return;
        }
        current = index;
        const newDraw = renderQuestion();
        if (!$("history-panel").hidden) renderHistory({ announce: newDraw });
        else renderBingo({ announce: newDraw });
      }
      function toggleHistory(open) {
        cancelRestart();
        $("history-panel").hidden = !open;
        $("show-history-label").hidden = open;
        $("hide-history-label").hidden = !open;
        $("history-toggle").setAttribute("aria-expanded", String(open));
        if (open) {
          renderHistory();
          $("history-hide").focus();
        } else {
          $("history-toggle").focus();
        }
      }
      $("start-timer").addEventListener("click", () => {
        cancelRestart();
        timer === null ? start() : pause();
      });
      $("reset-timer").addEventListener("click", () => {
        cancelRestart();
        resetTimer();
      });
      $("previous-question").addEventListener("click", () => moveTo(current - 1));
      $("next-question").addEventListener("click", () => moveTo(current + 1));
      $("restart-game").addEventListener("click", () => {
        if (!confirmingRestart) {
          confirmingRestart = true;
          $("restart-game").classList.add("is-confirming");
          $("restart-label").hidden = true;
          $("confirm-restart-label").hidden = false;
          return;
        }
        cancelRestart();
        pause();
        shuffle();
        current = 0;
        gameFinished = false;
        visited.clear();
        modeSnapshots.clear();
        clearTimeout(bingoNoticeTimer);
        $("bingo-notice").textContent = "";
        $("bingo-notice").hidden = true;
        toggleHistory(false);
        renderQuestion();
        renderBingo();
      });
      $("history-toggle").addEventListener("click", () => toggleHistory($("history-panel").hidden));
      $("history-hide").addEventListener("click", () => toggleHistory(false));

      $("bingo-mode-toggle").addEventListener("click", () => {
        const open = $("bingo-mode-toggle").getAttribute("aria-expanded") !== "true";
        $("bingo-mode-toggle").setAttribute("aria-expanded", String(open));
        $("bingo-mode-controls").hidden = !open;
      });
      $("bingo-toggle").addEventListener("click", () => {
        showAllBingo = !showAllBingo;
        $("bingo-toggle").setAttribute("aria-expanded", String(showAllBingo));
        $("bingo-toggle").textContent = showAllBingo ? "Ocultar ganadores" : "Ver ganadores";
        renderBingo();
      });
      $("bingo-player-count").addEventListener("change", () => {
        const max = bingoCards.length;
        const value = Number.parseInt($("bingo-player-count").value, 10);
        $("bingo-player-count").value = String(Number.isFinite(value) ? Math.max(1, Math.min(max, value)) : max);
        renderBingo();
      });
      document.querySelectorAll(".bingo-mode-option").forEach(button => {
        button.addEventListener("click", () => {
          selectedMode = button.dataset.mode;
          document.querySelectorAll(".bingo-mode-option").forEach(option => {
            const active = option.dataset.mode === selectedMode;
            option.classList.toggle("is-active", active);
            option.setAttribute("aria-pressed", String(active));
          });
          $("bingo-mode-toggle").setAttribute("aria-expanded", "false");
          $("bingo-mode-controls").hidden = true;
          renderBingo();
        });
      });

      document.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          if (!$("history-panel").hidden) toggleHistory(false);
          else cancelRestart();
        }
      });
      shuffle();
      pause();
      renderQuestion();
      pause();
      renderBingo();
    });
  </script>
 
</body></html>
